# =============================================================================
# LP Affiliate Site Template — Jekyll Configuration
# =============================================================================
# Edit these values to match your affiliate. Most of these are also editable
# through the CMS at /admin, under Site Settings (stored in _data/site.yml).
# =============================================================================

# --- Site identity -----------------------------------------------------------
title: "Podunk Libertarians"
description: "The Libertarian Party affiliate serving Jerkwater and Unincorporated Podunk."
url: "https://lporegon.github.io"           # Your GitHub Pages URL or custom domain (no trailing slash)
baseurl: "/lp-affiliate-template"           # Repo name for GitHub Pages; use "" for custom domains
email: "podunk@example.com"

# --- Geography & legal -------------------------------------------------------
geography: "Jerkwater and Unincorporated Podunk"
paid_for_by: "Paid for by the Podunk Libertarians PAC"

# --- Social links -------------------------------------------------------------
twitter: "https://twitter.com/PodunkLiberty"
facebook: "https://www.facebook.com/PodunkLibertarians"         # Public page
instagram: "https://www.instagram.com/podunklibertarians"
facebook_group: "https://www.facebook.com/groups/your-group-here"  # Members group (optional)

# --- Party links --------------------------------------------------------------
lp_national: "https://www.lp.org"
lp_state: "https://lp[state].org"
state_party_name: "LP [State]"

# --- Donation -----------------------------------------------------------------
anedot_url: "https://secure.anedot.com/your-org-here"

# --- Mailing list (choose one approach, leave the other blank) ----------------
# Option A: Embed a Brevo signup form directly on the page (lowest friction)
brevo_embed_url: ""     # Paste your Brevo iframe src URL here
# Option B: Link to an external signup form (Google Form, Mailchimp, etc.)
mailing_list_url: ""

# --- Events -------------------------------------------------------------------
# rsvp_url has moved to _data/site.yml (Meetup section) — edit it in the CMS.

# --- Analytics (optional) -----------------------------------------------------
# GoatCounter: free, no cookies, no consent banner required.
# Sign up at goatcounter.com, then enter your site code (the subdomain part of
# your GoatCounter URL, e.g. "podunklp" if your URL is podunklp.goatcounter.com)
# Leave blank to disable analytics entirely.
goatcounter_code: ""

# --- Jekyll build settings (do not change) ------------------------------------
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - CHANGELOG.md
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs/
  - LICENSE
